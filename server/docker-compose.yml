version: '3.8'

# =============================================================
# Runs BOTH halves of a self-hosted relay stack:
#   1. peerjs — the signaling server (Node)
#   2. coturn — the TURN media relay (guaranteed connect)
# =============================================================

services:
  # --- Signaling ---
  peerjs:
    image: node:20-alpine
    container_name: screencast-peerjs
    working_dir: /app
    volumes:
      - ./:/app
    # Install `peer` and start the signaling server.
    command: sh -c "npm install --no-save peer && node peerjs-server.js"
    ports:
      - "9000:9000"
    restart: unless-stopped
    environment:
      PORT: 9000
      # Change to your public host. For LAN-only you can use your
      # machine's LAN IP (e.g. 192.168.1.10).
      PUBLIC_HOST: localhost

  # --- TURN media relay ---
  turn:
    image: coturn/coturn
    container_name: screencast-turn
    network_mode: host          # coturn needs many UDP ports; host net is simplest
    volumes:
      - ./coturn.conf:/etc/coturn/turnserver.conf
    restart: unless-stopped
