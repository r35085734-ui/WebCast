# =============================================================
# coturn — TURN relay config
# ---------------------------------------------
# TURN is the "guaranteed" fallback: even when the laptop's NAT /
# firewall blocks a direct peer-to-peer link, traffic is relayed
# through this server, so the connection always establishes.
#
# This file is used by the coturn Docker service (docker-compose.yml).
# =============================================================

# Standard TURN listening ports
listening-port=3478
tls-listening-port=5349

# Mobile-friendly (UDP). coturn does this automatically.

# Authentication — long-term credential mechanism.
# Create a strong password and change the realm.
fingerprint
lt-cred-mech
realm=screencast.example.com

# One static user. You may add more lines.
user=screencast:CHANGE_ME_STRONG_PASSWORD

# Public IP that this server is reachable on. AUTO tries to detect it,
# but if you are behind NAT, set your ACTUAL public IP here.
external-ip=AUTO

# Don't leak / don't relay to multicast.
no-multicast-peers
no-stun
mobility

# Logging
log-file=/var/log/coturn.log
no-print-logs

# Keep it on.
fingerprint
